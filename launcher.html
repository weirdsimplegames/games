<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Climb Cube Climb — Launcher</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--lime:#d7ff76;--muted:#9ba8c3}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:#f6f8ff;font-family:'Space Grotesk',sans-serif}
body{background:radial-gradient(ellipse at 50% 35%,#1b2b4b 0,#10182c 45%,#090e1b 100%)}
#launcher{height:100%;display:grid;place-items:center;padding:24px}
.card{width:min(480px,100%);padding:42px 38px 30px;border:1px solid #ffffff20;border-radius:28px;background:linear-gradient(145deg,#1b2946e8,#111a30ed);box-shadow:0 30px 100px #0008;text-align:center;backdrop-filter:blur(20px)}
.mark{width:62px;height:62px;margin:0 auto 22px;display:grid;place-items:center;transform:rotate(-9deg);border-radius:17px;background:linear-gradient(145deg,#efffae,#a7e74d);box-shadow:9px 10px 0 #719d3d,0 15px 40px #baff5b38}
.mark:after{content:"";width:28px;height:28px;border:3px solid #fff9;border-radius:8px}
.kicker{font:10px 'DM Mono',monospace;letter-spacing:.2em;color:#a6b4d0}
h1{font-size:clamp(35px,8vw,51px);line-height:.94;letter-spacing:-.075em;margin:13px 0}
h1 em{font-style:normal;color:var(--lime)}
p{margin:13px 0 25px;color:#aebbd2;font-size:14px;line-height:1.6}
button{font:inherit;cursor:pointer}
#launch{width:100%;padding:16px;border:0;border-radius:13px;background:var(--lime);color:#17220e;font-size:12px;font-weight:700;letter-spacing:.12em;transition:.18s}
#launch:hover{filter:brightness(1.06);transform:translateY(-2px)}#launch:disabled{opacity:.6;cursor:wait;transform:none}
.status{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:18px;color:#9ba8c3;font:10px 'DM Mono',monospace;letter-spacing:.05em}
.dot{width:7px;height:7px;border-radius:50%;background:#71809d}.dot.live{background:var(--lime);box-shadow:0 0 12px #d7ff76}
.error{display:none;margin-top:17px;padding:12px;border:1px solid #ff8c8c55;border-radius:10px;background:#ff777710;color:#ffb6b6;font-size:12px;line-height:1.5}
.bottom{margin-top:25px;padding-top:18px;border-top:1px solid #ffffff14;color:#74829f;font:9px 'DM Mono',monospace;letter-spacing:.12em}
#game-view{display:none;position:fixed;inset:0;background:#10172b}
#game-frame{display:block;width:100%;height:100%;border:0;background:#10172b}
.game-tools{position:absolute;z-index:20;top:12px;right:12px;display:flex;gap:8px;opacity:.22;transition:opacity .2s}
.game-tools:hover,.game-tools:focus-within{opacity:1}
.tool{width:39px;height:39px;border:1px solid #ffffff30;border-radius:11px;background:#10172bdd;color:white;backdrop-filter:blur(12px)}
#loading-cover{position:fixed;inset:0;display:none;place-items:center;background:#0b1020;color:#d7ff76;font:12px 'DM Mono',monospace;letter-spacing:.12em;z-index:30}
@media(max-width:520px){.card{padding:34px 23px 24px;border-radius:22px}#launcher{padding:16px}}
</style>
</head>
<body>
<main id="launcher">
 <section class="card">
  <div class="mark"></div>
  <div class="kicker">A LITTLE GAME ABOUT GOING UP</div>
  <h1>CLIMB, CUBE<br><em>CLIMB!</em></h1>
  <p>Ready to climb? The launcher fetches the latest game files straight from GitHub every time you start.</p>
  <button id="launch">PLAY NOW <span aria-hidden="true">↗</span></button>
  <div class="status"><span class="dot" id="dot"></span><span id="status-text">CONNECTED TO GITHUB · READY</span></div>
  <div class="error" id="error" role="alert"></div>
  <div class="bottom">LIVE VERSION · GITHUB MAIN BRANCH</div>
 </section>
</main>
<section id="game-view" aria-label="Game">
 <iframe id="game-frame" title="Climb Cube Climb game" allow="fullscreen; autoplay"></iframe>
 <div class="game-tools">
  <button class="tool" id="reload" title="Reload latest game" aria-label="Reload latest game">↻</button>
  <button class="tool" id="full" title="Fullscreen" aria-label="Fullscreen">⛶</button>
  <button class="tool" id="home" title="Back to launcher" aria-label="Back to launcher">⌂</button>
 </div>
</section>
<div id="loading-cover">FETCHING LATEST GAME…</div>
<script>
(()=>{
 'use strict';
 const RAW='https://raw.githubusercontent.com/weirdsimplegames/games/main/';
 const launcher=document.getElementById('launcher'),view=document.getElementById('game-view'),frame=document.getElementById('game-frame');
 const launch=document.getElementById('launch'),status=document.getElementById('status-text'),dot=document.getElementById('dot'),error=document.getElementById('error'),cover=document.getElementById('loading-cover');
 let busy=false;
 function setStatus(message,online=false){status.textContent=message;dot.classList.toggle('live',online)}
 async function loadGame(){
  if(busy)return;busy=true;launch.disabled=true;launch.textContent='LOADING GAME…';error.style.display='none';setStatus('FETCHING LIVE FILES FROM GITHUB…');
  try{
   const response=await fetch(RAW+'index.html?cache='+Date.now(),{cache:'no-store'});
   if(!response.ok)throw new Error('GitHub returned HTTP '+response.status+'.');
   let html=await response.text();
   if(!html.toLowerCase().includes('<html'))throw new Error('The game HTML could not be read.');
   const base='<base href="'+RAW+'">';
   if(/<head[^>]*>/i.test(html))html=html.replace(/<head([^>]*)>/i,'<head$1>'+base);
   else html=base+html;
   frame.srcdoc=html;
   launcher.style.display='none';view.style.display='block';cover.style.display='grid';
   frame.onload=()=>{cover.style.display='none';setStatus('GAME LOADED',true)};
  }catch(err){
   error.textContent='Could not load the game. Check your internet connection and try again. ('+err.message+')';error.style.display='block';
   setStatus('COULD NOT CONNECT TO GITHUB');launch.disabled=false;launch.textContent='TRY AGAIN ↻';busy=false;
  }
 }
 launch.addEventListener('click',loadGame);
 document.getElementById('reload').addEventListener('click',()=>{frame.srcdoc='';loadGameFromGameView()});
 async function loadGameFromGameView(){
  cover.style.display='grid';
  try{
   const response=await fetch(RAW+'index.html?cache='+Date.now(),{cache:'no-store'});
   if(!response.ok)throw new Error('HTTP '+response.status);
   let html=await response.text();const base='<base href="'+RAW+'">';
   html=html.replace(/<head([^>]*)>/i,'<head$1>'+base);frame.srcdoc=html;
   frame.onload=()=>{cover.style.display='none'};
  }catch(e){cover.textContent='Could not refresh. Check your connection.';setTimeout(()=>{cover.style.display='none';cover.textContent='FETCHING LATEST GAME…'},1800)}
 }
 document.getElementById('full').addEventListener('click',()=>{if(!document.fullscreenElement)view.requestFullscreen?.();else document.exitFullscreen?.()});
 document.getElementById('home').addEventListener('click',()=>{frame.srcdoc='';view.style.display='none';launcher.style.display='grid';busy=false;launch.disabled=false;launch.textContent='PLAY NOW ↗';setStatus('CONNECTED TO GITHUB · READY',true)});
})();
</script>
</body>
</html>
